<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Masuk | Absen Perpustakaan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--biru:#1769D2;--tua:#0E4894;--bg:#F4F7FB;--teks:#0F1B2D;--redup:#5B6B80;--garis:#DCE8FA;--isian:#F1F5FB;--galat:#B42318}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:var(--bg);color:var(--teks);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.kartu{width:100%;max-width:360px;background:#fff;border-radius:28px;padding:32px 24px 28px}
.wm{margin:0;text-align:center;font-size:40px;font-weight:700;letter-spacing:-.03em;line-height:1;background:linear-gradient(135deg,#3A8CEB,#0E4894);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin:8px 0 0;text-align:center;font-size:14px;color:var(--redup)}
/* Maskot dan bubble */
.maskot{position:relative;display:flex;justify-content:center;margin:8px 0 14px}
.bubble{position:absolute;left:0;top:0;max-width:104px;background:#fff;border:1.5px solid var(--garis);border-radius:16px;padding:9px 12px;font-size:14px;font-weight:500;color:var(--tua);line-height:1.3}
.bubble::after{content:"";position:absolute;right:-7px;bottom:12px;width:11px;height:11px;background:#fff;border-top:1.5px solid var(--garis);border-right:1.5px solid var(--garis);transform:rotate(45deg)}
.al,.ar{transition:transform .3s cubic-bezier(.3,.8,.3,1);transform-box:fill-box;transform-origin:50% 10%}
.ms{opacity:0}
.en{transform-box:fill-box;transform-origin:50% 50%;animation:kedip 4.2s infinite}
.pp{transform:translate(var(--px,0px),var(--py,0px));transition:transform .15s}
#m.salam .ar{animation:salam 1.6s ease-in-out .5s 1 backwards}
@keyframes kedip{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes salam{0%{transform:rotate(0)}20%{transform:rotate(-150deg)}35%{transform:rotate(-172deg)}50%{transform:rotate(-148deg)}65%{transform:rotate(-172deg)}80%{transform:rotate(-150deg)}100%{transform:rotate(0)}}
#m[data-s=sandi] .al{transform:translate(51px,-16px) rotate(10deg)}
#m[data-s=sandi] .ar{transform:translate(-51px,-16px) rotate(-10deg)}
#m[data-s=salah] .mn{opacity:0}
#m[data-s=salah] .ms{opacity:1}
/* Form */
.fl{position:relative;display:flex;align-items:center;gap:10px;height:52px;padding:0 12px 0 18px;border-radius:999px;background:var(--isian);border:1.5px solid transparent;color:var(--redup)}
.fl+.fl{margin-top:12px}
.fl:focus-within{background:#fff;border-color:var(--biru);color:var(--biru)}
.fl.er{background:#FDF1F0;border-color:var(--galat);color:var(--galat)}
.fl input{flex:1;min-width:0;height:100%;border:0;outline:0;background:transparent;font:inherit;font-size:16px;color:var(--teks)}
.fl>svg:first-child{color:var(--biru)}
.fl.er>svg:first-child{color:var(--galat)}
.fl input::placeholder{color:#8A97A8}
.fl button{display:flex;align-items:center;justify-content:center;width:36px;height:36px;border:0;background:transparent;color:inherit;border-radius:50%;cursor:pointer}
.galat{display:flex;align-items:center;gap:6px;margin:12px 0 0 18px;font-size:13px;color:var(--galat)}
.masuk{width:100%;height:52px;margin-top:20px;border:0;border-radius:999px;background:linear-gradient(135deg,#2A7DE1,#0F4FA8);color:#fff;font:inherit;font-size:16px;font-weight:600;cursor:pointer}
.masuk:hover{filter:brightness(1.06)}
.masuk:active{transform:scale(.98)}
:focus-visible{outline:2px solid var(--biru);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main class="kartu">
  <h1 class="wm">absen.</h1>
  <p class="sub">Dashboard perpustakaan</p>

  <div class="maskot">
    <div id="bb" class="bubble">{{ "Hmm, belum cocok" if galat else "Halo!" }}</div>
    <svg id="m" class="{{ '' if galat else 'salam' }}" data-s="{{ 'salah' if galat else 'awal' }}" viewBox="-10 0 220 154" width="220" height="154" role="img" aria-label="Maskot kartu NFC">
      <rect x="40" y="30" width="120" height="116" rx="24" fill="#1769D2"/>
      <path d="M82 32q0-18 18-18t18 18z" fill="#A9CBF7"/>
      <circle cx="100" cy="12" r="4.5" fill="#A9CBF7"/>
      <rect x="54" y="44" width="24" height="17" rx="4" fill="#DCE8FA"/>
      <path d="M66 44v17M54 52.5h24" stroke="#1769D2" stroke-width="1.5" fill="none"/>
      <path d="M128 46q6 8 0 16M136 42q10 12 0 24" fill="none" stroke="#DCE8FA" stroke-width="3" stroke-linecap="round"/>
      <ellipse cx="68" cy="116" rx="6" ry="4" fill="#7FB0EC" opacity=".55"/>
      <ellipse cx="132" cy="116" rx="6" ry="4" fill="#7FB0EC" opacity=".55"/>
      <g class="en">
        <circle cx="82" cy="98" r="9" fill="#fff"/><circle class="pp" cx="82" cy="98" r="4.6" fill="#0E4894"/>
        <circle cx="118" cy="98" r="9" fill="#fff"/><circle class="pp" cx="118" cy="98" r="4.6" fill="#0E4894"/>
      </g>
      <path class="mn" d="M91 120q9 9 18 0" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
      <path class="ms" d="M91 125q9-8 18 0" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
      <rect class="al" x="22" y="96" width="18" height="40" rx="9" fill="#1259B3"/>
      <rect class="ar" x="160" y="96" width="18" height="40" rx="9" fill="#1259B3"/>
    </svg>
  </div>

  <form method="post" action="/login">
    <label class="fl{% if galat %} er{% endif %}">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <input id="u" name="username" type="text" autocomplete="username" autocapitalize="none" placeholder="Nama pengguna" aria-label="Nama pengguna" value="{{ nama or '' }}" required>
    </label>
    <label class="fl{% if galat %} er{% endif %}">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
      <input id="p" name="password" type="password" autocomplete="current-password" placeholder="Sandi" aria-label="Sandi" required>
      <button id="t" type="button" aria-label="Tampilkan sandi">
        <svg id="mata" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
        <svg id="tutup" style="display:none" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.9 17.9A10.9 10.9 0 0 1 12 19c-6.5 0-10-7-10-7a18.5 18.5 0 0 1 5.1-5.9M9.9 5.2A9.7 9.7 0 0 1 12 5c6.5 0 10 7 10 7a18.5 18.5 0 0 1-2.2 3.2M1 1l22 22"/><path d="M14.1 14.1a3 3 0 1 1-4.2-4.2"/></svg>
      </button>
    </label>
    {% if galat %}
    <p class="galat" role="alert">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
      {{ galat }}
    </p>
    {% endif %}
    <button class="masuk" type="submit">Masuk</button>
  </form>
</main>

<script>
(function () {
  var m = document.getElementById("m"), bb = document.getElementById("bb");
  var u = document.getElementById("u"), p = document.getElementById("p"), t = document.getElementById("t");
  var mata = document.getElementById("mata"), tutup = document.getElementById("tutup");
  var kata = { awal: "Halo!", sandi: "Aku tidak ngintip" };

  // Pupil mengikuti ketikan nama pengguna, kembali ke tengah saat selesai
  function lihat(x, y) { m.style.setProperty("--px", x + "px"); m.style.setProperty("--py", y + "px"); }
  u.addEventListener("focus", function () { lihat(-3, 2.5); });
  u.addEventListener("blur", function () { lihat(0, 0); });
  u.addEventListener("input", function () { lihat(-3 + 6 * Math.min(u.value.length / 16, 1), 2.5); });
  // Lambaian hanya sekali saat halaman dibuka
  m.addEventListener("animationend", function () { m.classList.remove("salam"); });

  function atur(k) { m.dataset.s = k; bb.textContent = kata[k]; }
  function tersembunyi() { return p.type === "password"; }

  // Maskot menutup mata hanya saat sandi tersembunyi dan sedang diketik
  p.addEventListener("focus", function () { atur(tersembunyi() ? "sandi" : "awal"); });
  p.addEventListener("blur", function (e) { if (e.relatedTarget !== t) atur("awal"); });

  t.addEventListener("click", function () {
    var sembunyikan = tersembunyi();
    p.type = sembunyikan ? "text" : "password";
    mata.style.display = sembunyikan ? "none" : "";
    tutup.style.display = sembunyikan ? "" : "none";
    t.setAttribute("aria-label", sembunyikan ? "Sembunyikan sandi" : "Tampilkan sandi");
    atur(tersembunyi() ? "sandi" : "awal");
    p.focus();
  });

  // Mulai mengetik lagi setelah salah: hapus tanda galat
  [u, p].forEach(function (el) {
    el.addEventListener("input", function () {
      document.querySelectorAll(".fl.er").forEach(function (x) { x.classList.remove("er"); });
      var g = document.querySelector(".galat");
      if (g) g.style.display = "none";
      if (m.dataset.s === "salah") atur(document.activeElement === p && tersembunyi() ? "sandi" : "awal");
    });
  });
})();
</script>
</body>
</html>
